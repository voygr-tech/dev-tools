[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voygr"
dynamic = ["version"]
description = "CLI and Python client for the Voygr Places API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yarik Markov", email = "yarik@voygr.tech" },
]
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "tenacity>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]

[tool.hatch.version]
path = "src/voygr/__init__.py"

[project.scripts]
voygr = "voygr.cli:cli"

[project.urls]
Homepage = "https://api.voygr.tech/docs/"
Repository = "https://github.com/voygr-tech/dev-tools"
